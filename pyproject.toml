[project]
name = "wiim-wakeup-light"
version = "0.1.2"
description = "Home Assistant custom integration for the WiiM Wake-up Light"
requires-python = ">=3.13"
dependencies = ["async-upnp-client==0.48.2"]

[dependency-groups]
test = [
  "homeassistant==2026.10.0b0",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
ignore = [
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC109", "S101", "SLF001"]

[tool.uv]
package = false
